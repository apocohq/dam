bypass_actors: []
conditions:
  ref_name:
    exclude:
      - refs/tags/*-rc*
    include:
      - refs/tags/v*
enforcement: active
name: Tags
rules:
  - type: deletion
  - type: non_fast_forward
  - type: creation
  - type: update
    parameters:
      update_allows_fetch_and_merge: false
target: tag
